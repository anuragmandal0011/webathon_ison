<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventHub | Discover Events</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="header">

        <nav class="navbar">

            <a href="#home" class="logo">
                <span class="logo-icon">E</span>
                Event<span>Hub</span>
            </a>

            <div class="nav-links" id="navLinks">
                <a href="#home">Home</a>
                <a href="#events">Events</a>
                <a href="#categories">Categories</a>
                <a href="#about">About</a>
            </div>

            <div class="nav-buttons">

                <button id="themeBtn" class="icon-btn">
                    🌙
                </button>

                <button id="registrationBtn" class="nav-register">
                    My Registrations
                </button>

            </div>

            <button id="menuBtn" class="menu-btn">
                ☰
            </button>

        </nav>

    </header>


    <!-- ================= HERO ================= -->

    <section class="hero" id="home">

        <div class="hero-container">

            <div class="hero-content">

                <span class="eyebrow">
                    DISCOVER • PARTICIPATE • EXPERIENCE
                </span>

                <h1>
                    Find events that
                    <span>move you.</span>
                </h1>

                <p>
                    Discover hackathons, workshops, competitions,
                    cultural events and much more — all in one place.
                </p>

                <div class="hero-buttons">

                    <a href="#events" class="primary-btn">
                        Explore Events →
                    </a>

                    <button id="heroRegistrationBtn" class="secondary-btn">
                        My Events
                    </button>

                </div>

                <div class="stats">

                    <div>
                        <strong id="eventCount">0</strong>
                        <span>Events</span>
                    </div>

                    <div>
                        <strong>5K+</strong>
                        <span>Participants</span>
                    </div>

                    <div>
                        <strong>50+</strong>
</body>
</html>
